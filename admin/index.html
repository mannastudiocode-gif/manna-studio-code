<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard — Manna Studio Code</title>
  <link rel="icon" href="../assets/msc-logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Login -->
<section id="login" class="login" hidden>
  <form class="login-box" id="login-form">
    <img src="../assets/msc-logo.png" alt="Manna Studio Code">
    <h1>Masuk Dashboard</h1>
    <label>Email<input type="email" name="email" required autocomplete="username"></label>
    <label>Kata sandi<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Masuk</button>
    <p class="err" id="login-err"></p>
    <a href="../" class="back">← Kembali ke website</a>
  </form>
</section>

<!-- Aplikasi -->
<div id="app" class="app" hidden>
  <aside class="side">
    <img src="../assets/msc-logo.png" alt="Manna Studio Code" class="side-logo">
    <nav id="menu">
      <a href="#ringkasan">📊 Ringkasan</a>
      <a href="#pelanggan">👥 Pelanggan</a>
      <a href="#invoice">🧾 Invoice</a>
      <a href="#dokumen">📁 Dokumen</a>
    </nav>
    <div class="side-foot">
      <span id="who"></span>
      <button class="btn btn-ghost btn-sm" id="logout">Keluar</button>
    </div>
  </aside>
  <main>
    <div id="demo-bar" class="demo-bar" hidden>
      <b>Mode demo.</b> Data hanya tersimpan di browser ini dan akan hilang jika riwayat browser dibersihkan. Isi <code>js/config.js</code> dengan kunci Supabase untuk menyimpan data secara online.
    </div>
    <div id="view"></div>
  </main>
</div>

<!-- Modal -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <header><h2 id="modal-title"></h2><button class="x" id="modal-x" aria-label="Tutup">×</button></header>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<div id="print-area"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
